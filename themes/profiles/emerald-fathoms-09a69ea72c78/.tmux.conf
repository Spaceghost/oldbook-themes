# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#07110d,fg=#d6e7df"
set -g message-style "bg=#37453f,fg=#deece5"
set -g pane-border-style "fg=#37453f"
set -g pane-active-border-style "fg=#2f9e6e"
set -g status-left "#[fg=#2f9e6e,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#6dcfb4]#(whoami)@#H #[fg=#91a099]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#84948d]#I:#W "
setw -g window-status-current-format "#[bg=#37453f,fg=#deece5,bold] #I:#W #[default]"
set -g clock-mode-colour "#2f9e6e"
set -g mode-style "bg=#4b5a54,fg=#deece5"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
