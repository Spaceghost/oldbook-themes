# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=22
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=0a1712ff
text=d6e7dfff
match=2f9e6eff
selection=37453fff
selection-text=deece5ff
selection-match=bda177ff
border=237351ff

[border]
width=1
radius=4
