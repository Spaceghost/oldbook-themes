[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=6x6 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Emerald Fathoms: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=d6e7df
background=0a1712
selection-foreground=deece5
selection-background=37453f
regular0=0a1712
regular1=846057
regular2=5b9457
regular3=237351
regular4=4d7d8d
regular5=725e8d
regular6=4d9480
regular7=91a099
bright0=84948d
bright1=bd8377
bright2=81cf77
bright3=2f9e6e
bright4=6dadc7
bright5=a37fc7
bright6=6dcfb4
bright7=d6e7df
cursor=0a1712 2f9e6e
urls=6dadc7
jump-labels=0a1712 2f9e6e
scrollback-indicator=0a1712 6dadc7
search-box-no-match=0a1712 bd8377
search-box-match=0a1712 81cf77

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff0a1712
border-width=0
border-color=ff37453f
button-color=ffd6e7df
button-minimize-color=ff6dadc7
button-maximize-color=ff81cf77
button-close-color=ffbd8377

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
