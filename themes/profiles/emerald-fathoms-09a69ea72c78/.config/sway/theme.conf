# Emerald Fathoms window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:DejaVu Serif 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #1e2c26 #1e2c26 #2f9e6e #2f9e6e #0a1712
client.focused_inactive #0a1712 #0a1712 #a9b9b2 #0a1712 #0a1712
client.unfocused        #07110d #07110d #84948d #07110d #07110d
client.urgent           #0a1712 #0a1712 #bd8377 #0a1712 #0a1712
client.placeholder      #0a1712 #0a1712 #a9b9b2 #0a1712 #0a1712

gaps inner 6
gaps outer 7
