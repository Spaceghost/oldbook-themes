# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c141b,fg=#E4DDD0"
set -g message-style "bg=#3f464a,fg=#e9e4d9"
set -g pane-border-style "fg=#3f464a"
set -g pane-active-border-style "fg=#B86B58"
set -g status-left "#[fg=#B86B58,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83c7b0]#(whoami)@#H #[fg=#9c9b96]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#8f8f8b]#I:#W "
setw -g window-status-current-format "#[bg=#3f464a,fg=#e9e4d9,bold] #I:#W #[default]"
set -g clock-mode-colour "#B86B58"
set -g mode-style "bg=#54595b,fg=#e9e4d9"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
