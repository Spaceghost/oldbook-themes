# Brineglass Vigil window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:DejaVu Sans 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #252e35 #252e35 #B86B58 #B86B58 #101B24
client.focused_inactive #101B24 #101B24 #b5b2aa #101B24 #101B24
client.unfocused        #0c141b #0c141b #8f8f8b #0c141b #0c141b
client.urgent           #101B24 #101B24 #d37b74 #101B24 #101B24
client.placeholder      #101B24 #101B24 #b5b2aa #101B24 #101B24

gaps inner 10
gaps outer 11
