[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Brineglass Vigil: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E4DDD0
background=101B24
selection-foreground=e9e4d9
selection-background=3f464a
regular0=101B24
regular1=955c5a
regular2=6c905a
regular3=825147
regular4=5e7991
regular5=835a91
regular6=5e9083
regular7=9c9b96
bright0=8f8f8b
bright1=d37b74
bright2=97c774
bright3=B86B58
bright4=83a5c4
bright5=b977c4
bright6=83c7b0
bright7=E4DDD0
cursor=101B24 B86B58
urls=83a5c4
jump-labels=101B24 B86B58
scrollback-indicator=101B24 83a5c4
search-box-no-match=101B24 d37b74
search-box-match=101B24 97c774

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff101B24
border-width=0
border-color=ff3f464a
button-color=ffE4DDD0
button-minimize-color=ff83a5c4
button-maximize-color=ff97c774
button-close-color=ffd37b74

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
