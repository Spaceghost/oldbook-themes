# Screenshot annotation in the Brineglass Vigil palette. oldbook-screenshot opens each
# capture here after the flash and shutter; Enter copies and closes, Escape
# closes, Ctrl+S overwrites the capture with the annotated version.
[general]
fullscreen = false
early-exit = true
corner-roundness = 12
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.0
save-after-copy = false
default-hide-toolbars = false
disable-notifications = true
actions-on-enter = ["save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
actions-on-right-click = ["save-to-clipboard"]

[font]
family = "Inter"
style = "Bold"

[color-palette]
palette = ["#B86B58", "#d37b74", "#97c774", "#83a5c4", "#b977c4", "#d39874"]
custom = ["#E4DDD0", "#101B24", "#83c7b0", "#825147", "#955c5a", "#5e7991"]
