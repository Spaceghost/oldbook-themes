# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Sans:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=101B24ff
text=E4DDD0ff
match=B86B58ff
selection=3f464aff
selection-text=e9e4d9ff
selection-match=d39874ff
border=825147ff

[border]
width=1
radius=6
