add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #5DE4FF"
style_root = "bold #c48e8e"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#75dacb"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8E4F1"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#aa8ade"

[git_status]
style = "#c4ac8e"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#75b8de"

[character]
success_symbol = "[❯](bold #89da8e)"
error_symbol = "[❯](bold #c48e8e)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #5DE4FF"
shell = ["sh"]
