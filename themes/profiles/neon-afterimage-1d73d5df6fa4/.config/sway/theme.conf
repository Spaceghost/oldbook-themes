# Neon Afterimage window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:JetBrainsMono Nerd Font 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #262231 #262231 #5DE4FF #5DE4FF #100D1C
client.focused_inactive #100D1C #100D1C #b8b5c2 #100D1C #100D1C
client.unfocused        #0c0a15 #0c0a15 #928e9c #0c0a15 #0c0a15
client.urgent           #100D1C #100D1C #c48e8e #100D1C #100D1C
client.placeholder      #100D1C #100D1C #b8b5c2 #100D1C #100D1C

gaps inner 10
gaps outer 11
