# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=52
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=100D1Cff
text=E8E4F1ff
match=5DE4FFff
selection=403c4bff
selection-text=ede9f4ff
selection-match=c4ac8eff
border=449fb6ff

[border]
width=1
radius=6
