[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Neon Afterimage: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E8E4F1
background=100D1C
selection-foreground=ede9f4
selection-background=403c4b
regular0=100D1C
regular1=8a656a
regular2=62986a
regular3=449fb6
regular4=5581a0
regular5=7962a0
regular6=559893
regular7=9f9ba9
bright0=928e9c
bright1=c48e8e
bright2=89da8e
bright3=5DE4FF
bright4=75b8de
bright5=aa8ade
bright6=75dacb
bright7=E8E4F1
cursor=100D1C 5DE4FF
urls=75b8de
jump-labels=100D1C 5DE4FF
scrollback-indicator=100D1C 75b8de
search-box-no-match=100D1C c48e8e
search-box-match=100D1C 89da8e

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff100D1C
border-width=0
border-color=ff403c4b
button-color=ffE8E4F1
button-minimize-color=ff75b8de
button-maximize-color=ff89da8e
button-close-color=ffc48e8e

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
