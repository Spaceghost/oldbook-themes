# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c0a15,fg=#E8E4F1"
set -g message-style "bg=#403c4b,fg=#ede9f4"
set -g pane-border-style "fg=#403c4b"
set -g pane-active-border-style "fg=#5DE4FF"
set -g status-left "#[fg=#5DE4FF,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#75dacb]#(whoami)@#H #[fg=#9f9ba9]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#928e9c]#I:#W "
setw -g window-status-current-format "#[bg=#403c4b,fg=#ede9f4,bold] #I:#W #[default]"
set -g clock-mode-colour "#5DE4FF"
set -g mode-style "bg=#555260,fg=#ede9f4"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
