# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Sans:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=60
horizontal-pad=24
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=111827ff
text=E8E1D2ff
match=B86B4Bff
selection=40444dff
selection-text=ede7dbff
selection-match=d39872ff
border=83503fff

[border]
width=1
radius=10
