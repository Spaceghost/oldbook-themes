# Starwarden’s Folly window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:DejaVu Sans 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #262c38 #262c38 #B86B4B #B86B4B #111827
client.focused_inactive #111827 #111827 #b9b5ac #111827 #111827
client.unfocused        #0d121d #0d121d #92918e #0d121d #0d121d
client.urgent           #111827 #111827 #d37b72 #111827 #111827
client.placeholder      #111827 #111827 #b9b5ac #111827 #111827

gaps inner 8
gaps outer 9
