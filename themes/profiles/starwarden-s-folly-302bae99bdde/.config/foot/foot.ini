[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=8x8 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Starwarden’s Folly: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E8E1D2
background=111827
selection-foreground=ede7db
selection-background=40444d
regular0=111827
regular1=955b5a
regular2=6c8f5a
regular3=83503f
regular4=5f7890
regular5=835990
regular6=5f8f83
regular7=9f9d98
bright0=92918e
bright1=d37b72
bright2=97c772
bright3=B86B4B
bright4=83a5c1
bright5=b977c1
bright6=83c7ae
bright7=E8E1D2
cursor=111827 B86B4B
urls=83a5c1
jump-labels=111827 B86B4B
scrollback-indicator=111827 83a5c1
search-box-no-match=111827 d37b72
search-box-match=111827 97c772

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff111827
border-width=0
border-color=ff40444d
button-color=ffE8E1D2
button-minimize-color=ff83a5c1
button-maximize-color=ff97c772
button-close-color=ffd37b72

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
