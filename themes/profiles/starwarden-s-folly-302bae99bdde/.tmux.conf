# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0d121d,fg=#E8E1D2"
set -g message-style "bg=#40444d,fg=#ede7db"
set -g pane-border-style "fg=#40444d"
set -g pane-active-border-style "fg=#B86B4B"
set -g status-left "#[fg=#B86B4B,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#83c7ae]#(whoami)@#H #[fg=#9f9d98]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#92918e]#I:#W "
setw -g window-status-current-format "#[bg=#40444d,fg=#ede7db,bold] #I:#W #[default]"
set -g clock-mode-colour "#B86B4B"
set -g mode-style "bg=#56585e,fg=#ede7db"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
