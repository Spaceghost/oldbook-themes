# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=58
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=101D24ff
text=E8D9B8ff
match=D56B4Bff
selection=404645ff
selection-text=ede1c6ff
selection-match=d89872ff
border=96523fff

[border]
width=1
radius=6
