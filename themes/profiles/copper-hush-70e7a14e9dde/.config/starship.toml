add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D56B4B"
style_root = "bold #d87b72"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88c7ae"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8D9B8"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bd77c1"

[git_status]
style = "#d89872"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88a5c1"

[character]
success_symbol = "[❯](bold #9cc772)"
error_symbol = "[❯](bold #d87b72)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D56B4B"
shell = ["sh"]
