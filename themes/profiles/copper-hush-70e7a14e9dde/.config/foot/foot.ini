[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=10x10 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Copper Hush: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.88
alpha-mode=all
foreground=E8D9B8
background=101D24
selection-foreground=ede1c6
selection-background=404645
regular0=101D24
regular1=985d59
regular2=6f9159
regular3=96523f
regular4=62798f
regular5=865a8f
regular6=629182
regular7=9f9986
bright0=928e7d
bright1=d87b72
bright2=9cc772
bright3=D56B4B
bright4=88a5c1
bright5=bd77c1
bright6=88c7ae
bright7=E8D9B8
cursor=101D24 D56B4B
urls=88a5c1
jump-labels=101D24 D56B4B
scrollback-indicator=101D24 88a5c1
search-box-no-match=101D24 d87b72
search-box-match=101D24 9cc772

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff101D24
border-width=0
border-color=ff404645
button-color=ffE8D9B8
button-minimize-color=ff88a5c1
button-maximize-color=ff9cc772
button-close-color=ffd87b72

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
