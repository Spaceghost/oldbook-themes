# Copper Hush window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:DejaVu Serif 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #263033 #263033 #D56B4B #D56B4B #101D24
client.focused_inactive #101D24 #101D24 #b8b097 #101D24 #101D24
client.unfocused        #0c151b #0c151b #928e7d #0c151b #0c151b
client.urgent           #101D24 #101D24 #d87b72 #101D24 #101D24
client.placeholder      #101D24 #101D24 #b8b097 #101D24 #101D24

gaps inner 10
gaps outer 11
