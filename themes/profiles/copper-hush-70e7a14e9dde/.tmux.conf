# Keep personal controls independent of theme colors and plugin managers.
source-file "$HOME/.config/tmux/oldbook.conf"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g status-style "bg=#0c151b,fg=#E8D9B8"
set -g message-style "bg=#404645,fg=#ede1c6"
set -g pane-border-style "fg=#404645"
set -g pane-active-border-style "fg=#D56B4B"
set -g status-left "#[fg=#D56B4B,bold] 󰆍 #S #[default]"
set -g status-right "#[fg=#88c7ae]#(whoami)@#H #[fg=#9f9986]%a %d %b %H:%M "
set -g status-left-length 32
set -g status-right-length 60
setw -g window-status-format " #[fg=#928e7d]#I:#W "
setw -g window-status-current-format "#[bg=#404645,fg=#ede1c6,bold] #I:#W #[default]"
set -g clock-mode-colour "#D56B4B"
set -g mode-style "bg=#555953,fg=#ede1c6"

# Select the pane under the pointer without clicking.
set -g mouse on
set -g focus-follows-mouse on

# Forward the active pane title to Sway and the workspace decoration.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
