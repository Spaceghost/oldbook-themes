# Honeyglass Watch window chrome; keep session commands and shortcuts in sway/config.
# Tiled windows keep their clean edges; floating, stacked and tabbed views get titles.
seat * xcursor_theme Oldbook-Ghost 24
font pango:DejaVu Serif 9.5
default_border pixel 0
default_floating_border normal 0
title_align left
titlebar_padding 18 7
titlebar_border_thickness 0

# Class                border  title bg text    indicator child border
client.focused          #262f33 #262f33 #D49A52 #D49A52 #101B22
client.focused_inactive #101B22 #101B22 #b8b4a3 #101B22 #101B22
client.unfocused        #0c1419 #0c1419 #929186 #0c1419 #0c1419
client.urgent           #101B22 #101B22 #d78273 #101B22 #101B22
client.placeholder      #101B22 #101B22 #b8b4a3 #101B22 #101B22

gaps inner 7
gaps outer 8
