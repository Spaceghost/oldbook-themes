# Geometry is shared by all desktop menus. oldbook-fuzzel supplies active theme colors.
[main]
font=DejaVu Serif:size=13
terminal=foot -e
prompt="Applications ❯ "
layer=overlay
lines=10
width=58
horizontal-pad=23
vertical-pad=20
inner-pad=14
line-height=28
image-size-ratio=0.55
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes

[colors]
background=101B22ff
text=E8DFC8ff
match=D49A52ff
selection=404647ff
selection-text=ede5d3ff
selection-match=d7a073ff
border=957143ff

[border]
width=1
radius=10
