[main]
selection-target=both
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=9.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=9.5
shell=zsh
pad=7x7 center
resize-delay-ms=40
initial-window-size-chars=106x30
initial-color-theme=dark

# Honeyglass Watch: warm charcoal, cream text, and the original 16-color palette.
[colors-dark]
alpha=0.9
alpha-mode=all
foreground=E8DFC8
background=101B22
selection-foreground=ede5d3
selection-background=404647
regular0=101B22
regular1=976159
regular2=6f9559
regular3=957143
regular4=627e8f
regular5=865e8f
regular6=629582
regular7=9f9c90
bright0=929186
bright1=d78273
bright2=9cce73
bright3=D49A52
bright4=88acc3
bright5=bd7ec3
bright6=88ceaf
bright7=E8DFC8
cursor=101B22 D49A52
urls=88acc3
jump-labels=101B22 D49A52
scrollback-indicator=101B22 88acc3
search-box-no-match=101B22 d78273
search-box-match=101B22 9cce73

[csd]
preferred=server
# Matching fallback when another Wayland compositor supplies no decorations.
size=18
font=Inter:size=9
color=ff101B22
border-width=0
border-color=ff404647
button-color=ffE8DFC8
button-minimize-color=ff88acc3
button-maximize-color=ff9cce73
button-close-color=ffd78273

[tweak]
# Foot submits damage for only the cells that changed, which is the right thing
# to do and is why it is so cheap to run. SwayFX blurs what is behind a
# transparent window by sampling past the damaged region, so a partial damage
# rectangle leaves the blur recomputed against a stale scene and smeared along
# the window edges. Ghostty never showed it because it damages its whole
# surface every frame. This makes Foot do the same, which is what the option
# exists for.
damage-whole-window=yes
