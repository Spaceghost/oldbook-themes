add_newline = false
format = "$username$hostname$directory${custom.fossil}$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold #D49A52"
style_root = "bold #d78273"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#88ceaf"
format = "[@$hostname]($style) "

[directory]
style = "bold #E8DFC8"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = "󰘬 "
style = "#bd7ec3"

[git_status]
style = "#d7a073"

[cmd_duration]
min_time = 500
format = " [󱎫 $duration]($style)"
style = "#88acc3"

[character]
success_symbol = "[❯](bold #9cce73)"
error_symbol = "[❯](bold #d78273)"

[custom.fossil]
command = "fossil branch current"
when = "fossil info >/dev/null 2>&1"
format = " [󰜘 $output]($style)"
style = "bold #D49A52"
shell = ["sh"]
